name: Notify parent site about updates

on:
  push:
    branches:
      - main
      - master

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Validate configuration
        env:
          PARENT_REPO: ${{ secrets.PARENT_REPO }}
          PARENT_REPO_TOKEN: ${{ secrets.PARENT_REPO_TOKEN }}
        run: |
          if [ -z "${PARENT_REPO}" ]; then
            echo "PARENT_REPO secret is not configured" >&2
            exit 1
          fi
          if [ -z "${PARENT_REPO_TOKEN}" ]; then
            echo "PARENT_REPO_TOKEN secret is not configured" >&2
            exit 1
          fi
      - name: Trigger repository_dispatch on parent
        env:
          GH_TOKEN: ${{ secrets.PARENT_REPO_TOKEN }}
          PARENT_REPO: ${{ secrets.PARENT_REPO }}
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${PARENT_REPO}/dispatches \
            -d "{\"event_type\":\"dsa-notes-updated\",\"client_payload\":{\"submodule\":\"dsa-notes\"}}"
